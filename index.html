<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recapacitar</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --primary: #22c55e;
        --secondary: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        width: min(900px, 90vw);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        padding: 48px 32px;
      }

      .tag {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.12);
        border: 1px solid rgba(34, 197, 94, 0.4);
        color: var(--primary);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: bold;
      }

      h1 {
        font-size: clamp(2.5rem, 6vw, 4.5rem);
        margin: 20px 0 16px;
        line-height: 1.1;
      }

      p {
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.7;
        margin: 0 0 24px;
      }

      .buttons {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 24px;
      }

      .btn {
        display: inline-block;
        padding: 14px 22px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: bold;
        transition: transform 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), #16a34a);
        color: white;
      }

      .btn-secondary {
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.4);
        color: var(--secondary);
      }

      .btn-danger {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <span class="tag">Cloudflare Pages</span>
      <h1>Recapacitar</h1>
      <p>
        Este proyecto está listo para conectarse a GitHub y desplegarse en Cloudflare Pages.
        Cuando subas los cambios a tu repositorio, Cloudflare podrá publicar automáticamente este sitio.
      </p>
      <div class="buttons">
        <a class="btn btn-primary" href="./auth/login.html">Ir al Login</a>
        <a class="btn btn-danger" href="./auth/register.html">Registrarse</a>
        <a class="btn btn-secondary" href="https://github.com/alejandro673/recapacitar" target="_blank" rel="noreferrer">Ver repositorio</a>
      </div>
    </main>
  </body>
</html>

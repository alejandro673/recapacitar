<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Red Dark</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="particles"></canvas>

    <main class="login-shell">
      <section class="login-card">
        <div class="login-content">
          <div class="brand">
            <div class="brand-mark">◆</div>
            <h1>Recapacitar</h1>
          </div>

          <p class="subtitle">Inicia sesión para continuar</p>

          <form id="loginForm">
            <div class="form-group">
              <span class="icon">👤</span>
              <input id="username" type="text" placeholder="Usuario" autocomplete="username" />
            </div>

            <div class="form-group">
              <span class="icon">🔒</span>
              <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" />
            </div>

            <div class="options">
              <label class="checkbox">
                <input type="checkbox" />
                <span>Recordarme</span>
              </label>
              <a href="#" class="link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="login-btn">Iniciar sesión</button>
            <div id="status" class="status" aria-live="polite"></div>
          </form>

          <p class="footer-text">
            ¿No tienes cuenta? <a href="#">Crear cuenta</a>
          </p>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>

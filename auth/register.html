<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de usuarios</title>
    <link rel="stylesheet" href="./styles-auth.css" />
  </head>
  <body>
    <div class="bg-glow"></div>

    <main class="auth-container">
      <section class="auth-card">
        <div class="brand">
          <div class="brand-icon">R</div>
          <h1>Recapacitar</h1>
        </div>

        <h2>Crear cuenta</h2>
        <p class="subtitle">Registra a un nuevo usuario</p>

        <form id="registerForm">
          <div class="grid two-columns">
            <label>
              <span>Nombre</span>
              <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana" required />
            </label>

            <label>
              <span>Apellidos</span>
              <input type="text" id="apellidos" name="apellidos" placeholder="Ej. López" required />
            </label>
          </div>

          <label>
            <span>Año de nacimiento</span>
            <input type="number" id="anio_nacimiento" name="anio_nacimiento" min="1900" max="2100" placeholder="Ej. 1998" required />
          </label>

          <label>
            <span>Email</span>
            <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required />
          </label>

          <label>
            <span>Contraseña</span>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
          </label>

          <button type="submit" class="primary-btn">Registrar usuario</button>
          <p id="message" class="message" aria-live="polite"></p>
        </form>

        <p class="footer-link">
          ¿Ya tienes cuenta? <a href="./login.html">Inicia sesión</a>
        </p>
      </section>
    </main>

    <script src="./register.js"></script>
  </body>
</html>
